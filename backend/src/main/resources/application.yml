server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/knowledge_workbench?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: root
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

jwt:
  secret: diagnose-illusion-jwt-secret-key-change-in-production-min-32-chars
  expiry-hours: 24

minio:
  endpoint: http://localhost:9000
  access-key: admin
  secret-key: 12345678
  bucket: knowledge

dify:
  base-url: http://localhost/v1
  api-key: app-xxx
  dataset-api-key: dataset-xxx
  stub-enabled: true
  upload:
    max-file-size-mb: 15

upload:
  avatar-max-size-mb: 2
