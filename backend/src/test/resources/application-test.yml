spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS knowledge_workbench
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: false

jwt:
  secret: test-jwt-secret-key-for-unit-tests-min-32-chars
  expiry-hours: 1

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: knowledge

dify:
  base-url: http://localhost/v1
  api-key: test
  dataset-api-key: test
  stub-enabled: true
  upload:
    max-file-size-mb: 15

upload:
  avatar-max-size-mb: 2
